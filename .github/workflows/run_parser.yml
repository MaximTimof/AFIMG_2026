name: Daily Fire Reports Downloader

on:
  schedule:
    # Запуск каждый день в 15:00 UTC (18:00 по МСК). 
    # Время можно изменить. Обратите внимание: у GitHub Actions бывают задержки запуска до 15-30 минут.
    - cron: '0 15 * * *'
  workflow_dispatch: # Позволяет запускать скрипт вручную кнопкой в интерфейсе GitHub

jobs:
  run-parser:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Дает право записывать скачанные файлы обратно в репозиторий

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Run script
      run: python download_fires.py

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        git add fire_reports/
        # Проверяем, появились ли новые файлы, чтобы избежать пустых коммитов
        if git diff --cached --quiet; then
          echo "No new PDF files discovered today."
        else
          git commit -m "Автоматическое обновление: добавлены новые отчеты о возгораниях"
          git push
        fi
